<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="A feedback loop: the agent acts in stoat, midwire checks what changed, docket records the decision, and the record feeds the agent&#x27;s next step.">
<style>@font-face { font-family:'Barlow'; font-weight:400; src:url(data:font/woff;base64,) format('woff'); }
@font-face { font-family:'JB'; font-weight:500; src:url(data:font/woff;base64,) format('woff'); }
  :root { --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --signal:#b4590b; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --signal:#f2a33a; }
  }

  .cmd { font:500 17px JB,monospace; fill:var(--fg); }
  .role { font:400 15px Barlow,sans-serif; fill:var(--muted); }
  .edge { font:500 11px JB,monospace; fill:var(--muted); letter-spacing:.16em; }
  .dot { fill:var(--line); }
  .box { fill:var(--signal); fill-opacity:0; stroke:var(--line); stroke-width:1.5;
          animation:6.4s linear infinite; }
  .yours { stroke-dasharray:5 4; }
  .tick { fill:none; stroke:var(--muted); stroke-width:1.25; stroke-linecap:square; }
  .track { fill:none; stroke:var(--line); stroke-width:1.5; }
  .head { fill:var(--muted); }
  .pulse { fill:none; stroke:var(--signal); stroke-linecap:round; animation:run 6.4s linear infinite; }
  @keyframes run { to { stroke-dashoffset:-1024; } }
  @keyframes lit-stoat { 0%,18.46%,33.79%,100% { stroke:var(--line); fill-opacity:0; } 18.95%,33.01% { stroke:var(--signal); fill-opacity:.09; } } @keyframes lit-midwire { 0%,37.40%,52.73%,100% { stroke:var(--line); fill-opacity:0; } 37.89%,51.95% { stroke:var(--signal); fill-opacity:.09; } } @keyframes lit-docket { 0%,68.46%,83.79%,100% { stroke:var(--line); fill-opacity:0; } 68.95%,83.01% { stroke:var(--signal); fill-opacity:.09; } } @keyframes lit-agent { 2.73%,87.40% { stroke:var(--line); fill-opacity:0; } 0%,1.95%,87.89%,100% { stroke:var(--signal); fill-opacity:.09; } }
  #box-agent { animation-name:lit-agent; } #box-stoat { animation-name:lit-stoat; } #box-midwire { animation-name:lit-midwire; } #box-docket { animation-name:lit-docket; }
  @media (prefers-reduced-motion: reduce) { .pulse, .box { animation:none; } .pulse { display:none; } }
</style>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="dot" cx="10" cy="10" r="1"/></pattern>
  <radialGradient id="fade" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="vignette" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="280"><rect width="800" height="280" fill="url(#fade)"/></mask>
  <mask id="gaps" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="280"><rect width="800" height="280" fill="#fff"/><rect x="116.0" y="42.0" width="188" height="64" fill="#000"/><rect x="496.0" y="42.0" width="188" height="64" fill="#000"/><rect x="496.0" y="174.0" width="188" height="64" fill="#000"/><rect x="116.0" y="174.0" width="188" height="64" fill="#000"/></mask>
</defs>
<rect width="800" height="280" fill="url(#grid)" mask="url(#vignette)"/>
<g mask="url(#gaps)"><path class="track" d="M210 74 H590 V206 H210 Z"/><path class="pulse" d="M210 74 H590 V206 H210 Z" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="0 0 96 928"/><path class="pulse" d="M210 74 H590 V206 H210 Z" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="0 44 52 928"/><path class="pulse" d="M210 74 H590 V206 H210 Z" stroke-opacity="1.0" stroke-width="2.75" stroke-dasharray="0 74 22 928"/></g>
<path class="head" d="M0 0 L-8 -4.5 L-8 4.5 Z" transform="translate(494.0 74) rotate(0)"/><path class="head" d="M0 0 L-8 -4.5 L-8 4.5 Z" transform="translate(590 172.0) rotate(90)"/><path class="head" d="M0 0 L-8 -4.5 L-8 4.5 Z" transform="translate(306.0 206) rotate(180)"/><path class="head" d="M0 0 L-8 -4.5 L-8 4.5 Z" transform="translate(210 108.0) rotate(270)"/><text class="edge" x="400.0" y="64" text-anchor="middle">ACTS</text><text class="edge" x="604" y="144.0">EFFECT</text><text class="edge" x="400.0" y="228" text-anchor="middle">VERDICT</text><text class="edge" x="196" y="144.0" text-anchor="end">CONTEXT</text><path class="tick" d="M110.0 43.0V36.0H117.0 M303.0 36.0H310.0V43.0 M310.0 105.0V112.0H303.0 M117.0 112.0H110.0V105.0"/><rect id="box-agent" class="box yours" x="116.0" y="42.0" width="188" height="64" rx="2"/><text class="cmd" x="132.0" y="71">agent</text><text class="role" x="132.0" y="93">your coding agent</text><path class="tick" d="M490.0 43.0V36.0H497.0 M683.0 36.0H690.0V43.0 M690.0 105.0V112.0H683.0 M497.0 112.0H490.0V105.0"/><rect id="box-stoat" class="box" x="496.0" y="42.0" width="188" height="64" rx="2"/><text class="cmd" x="512.0" y="71">stoat</text><text class="role" x="512.0" y="93">runs it in a VM</text><path class="tick" d="M490.0 175.0V168.0H497.0 M683.0 168.0H690.0V175.0 M690.0 237.0V244.0H683.0 M497.0 244.0H490.0V237.0"/><rect id="box-midwire" class="box" x="496.0" y="174.0" width="188" height="64" rx="2"/><text class="cmd" x="512.0" y="203">midwire</text><text class="role" x="512.0" y="225">checks what changed</text><path class="tick" d="M110.0 175.0V168.0H117.0 M303.0 168.0H310.0V175.0 M310.0 237.0V244.0H303.0 M117.0 244.0H110.0V237.0"/><rect id="box-docket" class="box" x="116.0" y="174.0" width="188" height="64" rx="2"/><text class="cmd" x="132.0" y="203">docket</text><text class="role" x="132.0" y="225">records the decision</text>
</svg>
